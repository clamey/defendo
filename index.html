<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Defendo</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cpolygon points=%2716,1 29,8.5 29,23.5 16,31 3,23.5 3,8.5%27 fill=%27%232b2540%27 stroke=%27%23e3b448%27 stroke-width=%272%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%276%27 fill=%27%23c8552b%27/%3E%3C/svg%3E" />
  </head>
  <body>
    <main id="app">
      <canvas id="board" aria-label="Game board"></canvas>

      <header id="hud" class="paper" hidden>
        <div class="track">
          <span class="track-label">Turn Record Track</span>
          <ol class="boxes turn-boxes" id="turn-track"></ol>
        </div>
        <div class="track strength">
          <span class="track-label"><span id="hud-tower-name">Tower</span> Strength<strong id="hud-hp">20 / 20</strong></span>
          <ol class="boxes strength-boxes" id="strength-track"></ol>
        </div>
        <div class="hud-buttons">
          <button id="btn-speed" class="chit" title="Game speed" aria-label="Game speed 1×">1×</button>
          <button id="btn-mute" class="chit" title="Sound on/off" aria-label="Sound" aria-pressed="false">♪</button>
        </div>
      </header>

      <section id="panel" class="paper" hidden></section>
      <section id="dialog" hidden aria-live="polite"></section>
      <div id="banner" class="paper" hidden></div>

      <section id="title" class="screen">
        <div class="box">
          <div class="stripes"><span></span><span></span><span></span></div>
          <p class="publisher">Starbase Games presents</p>
          <h1>Defendo</h1>
          <p class="subtitle">The Game of Interstellar Siege</p>
          <ul class="badges">
            <li>1 Player</li>
            <li>Ages 10 to Adult</li>
            <li>Hex Map &amp; Die-Cut Counters</li>
          </ul>
          <button id="btn-open" class="big">Open the Box</button>
        </div>
      </section>

      <section id="pick" class="screen" hidden>
        <h2>Choose Your Biotype</h2>
        <div class="cards">
          <button class="card" data-side="human"></button>
          <button class="card" data-side="monster"></button>
        </div>
      </section>

      <section id="modal" class="screen" hidden></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
